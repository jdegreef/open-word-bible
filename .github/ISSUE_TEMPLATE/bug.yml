name: Bug
description: Something on openwordbible.org or in the tools is wrong
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Page URL, or the script or command.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
