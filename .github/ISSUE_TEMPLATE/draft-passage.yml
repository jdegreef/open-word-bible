name: Draft a passage
description: AI-draft a book or chapters in one language
title: "Draft <book> <chapters> in <language>"
labels: [drafting]
body:
  - type: input
    id: passage
    attributes:
      label: Passage
      placeholder: Ruth 1-4
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, Spanish, French, Portuguese, Swahili]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Key terms to settle first, style brief sections that apply, anything unusual.
