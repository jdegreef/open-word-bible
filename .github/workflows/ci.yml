# The "Before pushing" checks from CLAUDE.md, run on every pull request and
# on main (which Render deploys to openwordbible.org).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run, so superseded runs
# (merging main in, fixups) don't hold runners. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Most pull requests only add content. The backend job runs when a pull
  # request touches code it depends on, and on every push to main, which
  # still checks that new content imports into the database.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo backend=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The pull request merge commit; its first parent is the base branch.
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          # scripts/: the backend builds its search tables with build_site.py.
          if grep -qE '^(backend/|owb/|scripts/|\.github/workflows/|sources\.lock\.json$)' changed.txt; then
            echo backend=true >> "$GITHUB_OUTPUT"
          else
            echo backend=false >> "$GITHUB_OUTPUT"
          fi

  content:
    name: Content, tests and site
    runs-on: ubuntu-latest
    env:
      OWB_VENDOR: ${{ github.workspace }}/vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Settings in pyproject.toml; the version is pinned so a ruff release
      # can't fail a pull request that changed nothing it checks.
      - name: Lint
        run: pipx run --spec ruff==0.16.9 ruff check .
      # The pinned sources only change when sources.lock.json does.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: sources-${{ hashFiles('sources.lock.json') }}
      - name: Fetch pinned sources
        run: python3 scripts/fetch_sources.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .
      # The reader's copy of the markup rules (web/markup.js) against the
      # same cases (tests/markup_vectors.json); the runner's own Node.
      - name: Reader tests
        run: node --test tests/js/*.test.mjs
      - name: Validate content
        run: python3 -m owb.validate content/*/*.json
      - name: Word extracts are up to date
        run: python3 scripts/extract_tokens.py --check
      - name: Build the site
        run: python3 scripts/build_site.py

  backend:
    name: Backend (Django + Postgres)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The tests take a few minutes; a hang (a search query once ran for
    # hours on a bad plan) should fail the run, not hold a runner for six.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/owb
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migrations are up to date
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Backend tests
        # -v 2 prints each test as it starts, so a stall names its test
        # (bare progress dots stay buffered and the log looks hung), and
        # --durations lists the slowest at the end.
        run: python backend/manage.py test backend_tests -v 2 --durations 10
