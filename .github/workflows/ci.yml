# The "Before pushing" checks from CLAUDE.md, run on every pull request and
# on main (which Render deploys to openwordbible.org).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content:
    name: Content, tests and site
    runs-on: ubuntu-latest
    env:
      OWB_VENDOR: ${{ github.workspace }}/vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The pinned sources only change when sources.lock.json does.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: sources-${{ hashFiles('sources.lock.json') }}
      - name: Fetch pinned sources
        run: python3 scripts/fetch_sources.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .
      - name: Validate content
        run: python3 -m owb.validate content/*/*.json
      - name: Word extracts are up to date
        run: python3 scripts/extract_tokens.py --check
      - name: Build the site
        run: python3 scripts/build_site.py

  backend:
    name: Backend (Django + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/owb
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migrations are up to date
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Backend tests
        run: python backend/manage.py test backend_tests
