# The backend tests on all of content/, every night. CI's backend job
# (ci.yml) tests on a few books (backend/backend_tests/__init__.py,
# owb/subset.py), which took the job from about 37 minutes to a fraction of
# that; this catches what only the whole text would show (a record in a
# book the subset leaves out that the import or search chokes on).
name: Backend on all content

on:
  schedule:
    - cron: "40 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (all of content/)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/owb
      DJANGO_DEBUG: "1"
      OWB_ONLY_BOOKS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend tests
        run: python backend/manage.py test backend_tests -v 2 --durations 10
