# Render Blueprint for Open Word Bible. Create it in Render with
# New > Blueprint and this repository. Plan names are the smallest paid tiers
# at the time of writing; change them in the dashboard if Render renames them.

databases:
  # Postgres: imported texts, our sentence records, reviews and users.
  - name: owb-db
    databaseName: owb
    user: owb
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # The public reader site, built from content/ and data/grc/.
  - type: web
    name: open-word-bible
    runtime: static
    buildCommand: python3 scripts/build_site.py
    # The ready-made downloads are the "downloads" release's
    # (.github/workflows/downloads.yml), not made in every build.
    envVars:
      - key: OWB_DOWNLOADS_RELEASE
        value: https://github.com/jdegreef/open-word-bible/releases/download/downloads
    staticPublishPath: site
    # Pipeline minutes are most of the Render bill, and a full site build
    # takes about 29 minutes. Previews used to build for every pull request
    # (566 in November 2026, most of them content PRs nobody opened a
    # preview of). Now a pull request gets one only when its title contains
    # [render preview].
    previews:
      generation: manual
    # Changes that cannot alter the site don't rebuild it (each build is
    # about 29 minutes; deploy.yml SITE_IGNORED repeats this list). scripts/build_site.py reads content/, data/,
    # articles/, i18n/, web/, owb/ and scripts/, never these.
    buildFilter:
      ignoredPaths:
        - backend/**
        - docs/**
        - tests/**
        - .github/**
        - .claude/**
        - cloudflare/**
    # Not deployed on every merge: .github/workflows/deploy.yml deploys the
    # newest main whose CI passed, four times a day, through this service's
    # deploy hook (each build is about 29 pipeline minutes, and main had 5 to
    # 9 green commits a day). Run that workflow by hand to deploy at once.
    autoDeployTrigger: "off"
    domains:
      - openwordbible.org
      - www.openwordbible.org
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # What pages may load (tests/test_headers.py checks it against the
      # built site). The one executable inline script is the boot script in
      # each page's head, allowed by its hash: scripts/build_site.py
      # BOOT_SCRIPT_HASH, which the test compares with this. connect-src
      # names the API (OWB_API_URL). Inline styles stay allowed for style=""
      # attributes (colour swatches, menu columns, progress meters);
      # <style> elements are not.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-R1ge6oFeKSxSWMWAX6q5Mk2Cz/nvlXinUaZF7aBzFd0='; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'sha256-Vjdni3LI8S90EpgQbHEZ/A+16JxQofSIDa+PSZqFBdE='; img-src 'self'; font-src 'self'; connect-src 'self' https://api.openwordbible.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Nothing on the site uses these but passkeys (web/account.js), which
      # the site's own pages may make and use. Listen uses speechSynthesis,
      # and sharing uses navigator.share and the clipboard, none of which
      # these cover.
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-create=(self), publickey-credentials-get=(self), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=()"
      # The offline worker (web/sw.js) is checked on every visit, so a
      # deploy reaches readers at once.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      # Scripts, style sheets and reader data are always named with their
      # content hash (/reader.js?v=..., scripts/build_site.py asset,
      # chapter_shared, reader_shared), so a deploy that changes one names a
      # new URL and browsers may keep each copy a year. Named one by one, not
      # /*.js, which would take in /sw.js above; tests/test_headers.py keeps
      # the list in step with build_site.WEB_FILES and checks that the built
      # pages name them only with a version. Fonts are left out: style.css
      # names them without one.
      - path: /style.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /markup.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /memorize.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /reader.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /site.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /account.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /search.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /plans.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /compare.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /word.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /saved.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /groups.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /edition.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /map.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /journeys.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /admin-core.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /admin.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /admin-review.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /admin-quality.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /admin-publish.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /admin.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /reader-*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /chapter-data/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # Renamed pages keep their old addresses working.
    routes:
      - type: redirect
        source: /articles/ai-drafts-and-human-review
        destination: /articles/ai-assisted-translation-and-human-review/
      - type: redirect
