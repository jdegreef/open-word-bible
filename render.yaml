# Render Blueprint for Open Word Bible. Create it in Render with
# New > Blueprint and this repository. Plan names are the smallest paid tiers
# at the time of writing; change them in the dashboard if Render renames them.

databases:
  # Postgres: imported texts, our sentence records, reviews and users.
  - name: owb-db
    databaseName: owb
    user: owb
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # The public reader site, built from content/ and data/grc/.
  - type: web
    name: open-word-bible
    runtime: static
    buildCommand: python3 scripts/build_site.py
    staticPublishPath: site
    pullRequestPreviewsEnabled: true
    domains:
      - openwordbible.org
      - www.openwordbible.org
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # Django API and admin (backend/). Load the source texts once from the
  # service's Shell; after that every deploy reloads content/ by itself:
  #   python scripts/fetch_sources.py
  #   python backend/manage.py import_texts
  #   python backend/manage.py import_content
  #   python backend/manage.py createsuperuser
  - type: web
    name: owb-api
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput
    # Migrate, then reload content/ so the API matches main. The import skips
    # itself until import_texts has been run once (see below).
    preDeployCommand: python backend/manage.py migrate --noinput && python backend/manage.py import_content --if-texts-loaded
    # Threads, so a slow request (such as sending a sign-in email) does not
    # hold up reading.
    startCommand: gunicorn --chdir backend config.wsgi --workers 2 --threads 4 --worker-class gthread --timeout 60
    healthCheckPath: /healthz
    domains:
      - api.openwordbible.org
    envVars:
      # The version CI tests with (.github/workflows/ci.yml).
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: owb-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: api.openwordbible.org
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api.openwordbible.org
      # Accounts (backend/accounts/). The reader site calls the API from
      # these origins, and sign-in links point at OWB_SITE_URL.
      - key: OWB_SITE_URL
        value: https://openwordbible.org
      - key: CORS_ALLOWED_ORIGINS
        value: https://openwordbible.org,https://www.openwordbible.org
      # Set these in the dashboard; they are not published here.
      # OWB_SUPER_ADMIN_EMAILS: comma-separated super admin emails.
      # EMAIL_*: SMTP for sign-in emails (e.g. Resend: smtp.resend.com, 587,
      # user "resend", password = API key). Without EMAIL_HOST no email is sent.
      - key: OWB_SUPER_ADMIN_EMAILS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
