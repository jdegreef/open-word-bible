# Render Blueprint for Open Word Bible. Create it in Render with
# New > Blueprint and this repository. Plan names are the smallest paid tiers
# at the time of writing; change them in the dashboard if Render renames them.

databases:
  # Postgres: imported texts, our sentence records, reviews and users.
  - name: owb-db
    databaseName: owb
    user: owb
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # The public reader site, built from content/ and data/grc/.
  - type: web
    name: open-word-bible
    runtime: static
    buildCommand: python3 scripts/build_site.py
    staticPublishPath: site
    pullRequestPreviewsEnabled: true
    # Deploy main only once its CI checks (.github/workflows/ci.yml) pass, so
    # a red main never goes live. Render skips the deploy if a check fails or
    # none are reported; the next green commit deploys.
    autoDeployTrigger: checksPass
    domains:
      - openwordbible.org
      - www.openwordbible.org
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # What pages may load (tests/test_headers.py checks it against the
      # built site). The one executable inline script is the boot script in
      # each page's head, allowed by its hash: scripts/build_site.py
      # BOOT_SCRIPT_HASH, which the test compares with this. connect-src
      # names the API (OWB_API_URL). Inline styles stay allowed for style=""
      # attributes (colour swatches, menu columns, progress meters);
      # <style> elements are not.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-R1ge6oFeKSxSWMWAX6q5Mk2Cz/nvlXinUaZF7aBzFd0='; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'sha256-Vjdni3LI8S90EpgQbHEZ/A+16JxQofSIDa+PSZqFBdE='; img-src 'self'; font-src 'self'; connect-src 'self' https://api.openwordbible.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Nothing on the site uses these. Listen uses speechSynthesis, and
      # sharing uses navigator.share and the clipboard, none of which these
      # cover.
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=()"
      # The offline worker (web/sw.js) is checked on every visit, so a
      # deploy reaches readers at once.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    # Renamed pages keep their old addresses working.
    routes:
      - type: redirect
        source: /articles/ai-drafts-and-human-review
        destination: /articles/ai-assisted-translation-and-human-review/
      - type: redirect
        source: /articles/ai-drafts-and-human-review/
        destination: /articles/ai-assisted-translation-and-human-review/

  # Django API and admin (backend/). Every deploy loads whatever source
  # texts are missing (import_texts --missing: nothing to do once they are
  # all in, so no sources are fetched), then imports the content/ files that
  # changed and updates the search entries that changed. Each deploy
  # starts with a fresh disk, so the command fetches just the sources it
  # needs, and imports one edition per process to stay within the starter
  # plan's 512 MB. A failed fetch or import is logged and retried on the next
  # deploy; it does not stop the deploy. The first deploy after this was
  # added loads wlc and the six reference Bibles (several minutes).
  # Create the first admin once from the service's Shell:
  #   python backend/manage.py createsuperuser
  - type: web
    name: owb-api
    runtime: python
    plan: starter
    # As for the site: deploy main only once its CI checks pass.
    autoDeployTrigger: checksPass
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput
    # Migrate, load any missing source texts, then import what changed in
    # content/ so the API matches main. Render stops a pre-deploy command after
    # 30 minutes, and reloading all of content/ and search came to take
    # longer than that; import_content explains. Management commands have no statement timeout; web
    # requests give up on a query after DB_STATEMENT_TIMEOUT_MS (15 s).
    preDeployCommand: python backend/manage.py migrate --noinput && python backend/manage.py import_texts --missing && python backend/manage.py import_content --if-texts-loaded --budget 900
    # Threads, so a slow request (such as sending a sign-in email) does not
    # hold up reading.
    startCommand: gunicorn --chdir backend config.wsgi --workers 2 --threads 4 --worker-class gthread --timeout 60
    healthCheckPath: /healthz
    domains:
      - api.openwordbible.org
    envVars:
      # The version CI tests with (.github/workflows/ci.yml).
      - key: PYTHON_VERSION
        value: "3.13"
      # Logs line by line, not in blocks, so the deploy log shows where a
      # slow pre-deploy actually is.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: owb-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: api.openwordbible.org
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api.openwordbible.org
      # Accounts (backend/accounts/). The reader site calls the API from
      # these origins, and sign-in links point at OWB_SITE_URL.
      - key: OWB_SITE_URL
        value: https://openwordbible.org
      - key: CORS_ALLOWED_ORIGINS
        value: https://openwordbible.org,https://www.openwordbible.org
      # Set these in the dashboard; they are not published here.
      # OWB_SUPER_ADMIN_EMAILS: comma-separated super admin emails.
      # EMAIL_*: SMTP for sign-in emails (e.g. Resend: smtp.resend.com, 587,
      # user "resend", password = API key). Without EMAIL_HOST no email is sent.
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET: "Continue with Google"; the
      # OAuth client's redirect URI is
      # https://api.openwordbible.org/api/auth/google/callback.
      # SENTRY_DSN: optional; errors go to Sentry as well as the log. Events
      # carry no cookies, headers, query strings or searches (config/sentry.py).
      - key: OWB_SUPER_ADMIN_EMAILS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
