  # Django API and admin (backend/). Every deploy loads whatever source
  # texts are missing (import_texts --missing: nothing to do once they are
  # all in, so no sources are fetched), then imports the content/ files that
  # changed and updates the search entries that changed. Each deploy
  # starts with a fresh disk, so the command fetches just the sources it
  # needs, and imports one edition per process to keep memory low (it was
  # written for the starter plan's 512 MB). A failed fetch or import is logged and retried on the next
  # deploy; it does not stop the deploy. The first deploy after this was
  # added loads wlc and the six reference Bibles (several minutes).
  # Create the first admin once from the service's Shell:
  #   python backend/manage.py createsuperuser
  - type: web
    name: owb-api
    runtime: python
    # Standard (2 GB): the search update peaked at about 460 MB, too close
    # to the starter plan's 512 MB, when it ran in this service's pre-deploy
    # (it is the owb-import job's now; see whether starter fits).
    plan: standard
    # As for the site: deployed by .github/workflows/deploy.yml a few times
    # a day, not on every merge.
    autoDeployTrigger: "off"
    # Changes the API never reads don't deploy it (deploy.yml API_IGNORED
    # repeats this list).
    # web/ is the reader site's own code; backend/ names it only in comments.
    buildFilter:
      ignoredPaths:
        - web/**
        - tests/**
        - .github/**
        - .claude/**
        - cloudflare/**
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput
    # Migrate and make the cache table (settings.py CACHES), then sync_fixes
    # emails readers whose suggestion led to a merged fix (it never fails
    # the deploy). Loading source texts, importing content/ and updating
    # search used to run here too, up to 25 of Render's 30 allowed minutes
    # on every deploy, billed as pipeline minutes; the owb-import cron job
    # below does that now, so a deploy takes a minute or two.
    preDeployCommand: python backend/manage.py migrate --noinput && python backend/manage.py createcachetable && (python backend/manage.py sync_fixes || true)
    # Threads, so a slow request (such as sending a sign-in email) does not
    # hold up reading.
    startCommand: gunicorn --chdir backend config.wsgi --workers 2 --threads 4 --worker-class gthread --timeout 60
    healthCheckPath: /healthz
    domains:
      - api.openwordbible.org
    envVars:
      # The version CI tests with (.github/workflows/ci.yml).
      - key: PYTHON_VERSION
        value: "3.13"
      # Logs line by line, not in blocks, so the deploy log shows where a
      # slow pre-deploy actually is.
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: owb-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: api.openwordbible.org
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api.openwordbible.org
      # Accounts (backend/accounts/). The reader site calls the API from
      # these origins, and sign-in links point at OWB_SITE_URL.
      - key: OWB_SITE_URL
        value: https://openwordbible.org
      - key: CORS_ALLOWED_ORIGINS
        value: https://openwordbible.org,https://www.openwordbible.org
      # The cache (settings.py CACHES): review states, dashboard counts,
      # checks, GitHub lookups. Without it the cache is a Postgres table.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: owb-cache
          property: connectionString
      # The API is for our own use (backend/config/access.py): pages from
      # the origins above (and the partner sites in settings.py) may call
      # it, nothing else may. /api/editions/, /api/text/ and /api/passages/
      # need a key as well. OWB_API_KEYS (set in the dashboard, comma-
      # separated) are those keys, for our own servers and scripts, sent as
      # the X-OWB-Key header. Never put one in the site's code.
      - key: OWB_API_KEYS
        sync: false
      # Set these in the dashboard; they are not published here.
      # OWB_SUPER_ADMIN_EMAILS: comma-separated super admin emails.
      # EMAIL_*: SMTP for sign-in emails (e.g. Resend: smtp.resend.com, 587,
      # user "resend", password = API key). Without EMAIL_HOST no email is sent.
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET: "Continue with Google"; the
      # OAuth client's redirect URI is
      # https://api.openwordbible.org/api/auth/google/callback.
      # SENTRY_DSN: optional; errors go to Sentry as well as the log. Events
      # carry no cookies, headers, query strings or searches (config/sentry.py).
      # SENTRY_TRACES_SAMPLE_RATE: optional, 0 to 1; that share of requests
      # also sends its timings (database spans without their parameters), to
      # find slow pages. Unset is 0. Every API answer carries a
      # Server-Timing header either way.
      - key: OWB_SUPER_ADMIN_EMAILS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        sync: false

  # The owb-alerts cron job (backend/staff/alerts.py, every 30 minutes) is
  # left out until owb-api has SMTP settings: it only sends email, and it
  # reads EMAIL_* from owb-api, so the Blueprint sync fails while those are
  # unset. To bring it back, set EMAIL_HOST, EMAIL_HOST_USER,
  # EMAIL_HOST_PASSWORD and DEFAULT_FROM_EMAIL on owb-api, then restore the
  # service from git history (render.yaml at 4ed6799).

  # Reading-plan emails (backend/accounts/reminders.py), every hour: each
  # reader who turned them on gets the next day of their plan, at the hour
  # they chose in their time zone. Billed separately from the API service.
  # DJANGO_SECRET_KEY comes from owb-api because it signs the unsubscribe
  # links the API checks. The EMAIL_* settings are set here in the
  # dashboard (copy owb-api's), not read from owb-api with fromService: that
  # is what made the Blueprint sync fail for owb-alerts while owb-api had
  # none. Until EMAIL_HOST is set the job sends nothing and marks nothing
  # sent (send_plan_reminders), so readers lose no days.
  - type: cron
    name: owb-reminders
    runtime: python
    plan: starter
    schedule: "5 * * * *"
    # Rebuild only for what the job reads: Django, owb/ (languages), the
    # message catalogs and the plan and book lists (accounts/reminders.py).
    # Without this every merge to main rebuilt it.
    buildFilter:
      paths:
        - backend/**
        - owb/**
        - i18n/**
        - data/plans.json
        - data/books.json
        - data/languages.json
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/manage.py send_plan_reminders
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: owb-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: owb-api
          envVarKey: DJANGO_SECRET_KEY
      - key: OWB_SITE_URL
        value: https://openwordbible.org
      - key: OWB_API_URL
        value: https://api.openwordbible.org
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # Imports content/ into the database and updates search, every hour
  # (backend/import_job.sh): what owb-api's pre-deploy used to do on every
  # deploy. It then measures each language's content checks for the admin
  # (precompute_checks) and opens the admin's slow pages once (warm_admin).
  # A run with nothing changed takes a minute or so; one after a
  # big merge may take most of the hour, and leaves what it could not
  # finish for the next. Billed by the minute it runs, at the plan's rate,
  # rather than as pipeline minutes. Standard (2 GB) for the search
  # update's ~460 MB peak.
  # Deployed with owb-api by .github/workflows/deploy.yml (its deploy hook
  # is the RENDER_IMPORT_DEPLOY_HOOK secret), so it imports the same main the
  # API serves. The EMAIL_* and OWB_SUPER_ADMIN_EMAILS settings, for
  # send_alerts, are set here in the dashboard (copy owb-api's).
  - type: cron
    name: owb-import
    runtime: python
    plan: standard
    schedule: "35 * * * *"
    autoDeployTrigger: "off"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: backend/import_job.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: owb-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: owb-api
          envVarKey: DJANGO_SECRET_KEY
      # The API's cache, so warm_admin fills the counts the API reads (and
      # the import's own cache changes reach it).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: owb-cache
          property: connectionString
      - key: OWB_SITE_URL
        value: https://openwordbible.org
      - key: OWB_SUPER_ADMIN_EMAILS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false

  # The API's cache (REDIS_URL above), so cache reads and writes stop
  # competing with real queries in Postgres. Free plan: losing it on a
  # restart only means the next requests recompute what they need. Reached
  # only from Render's private network (no allow-list entries).
  - type: keyvalue
    name: owb-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
