# Project metadata and lint settings. Nothing here is installed: the build
# scripts run from a checkout (python3 scripts/build_site.py) and the backend
# installs backend/requirements.txt.
[project]
name = "open-word-bible"
version = "0"
description = "A CC0 Bible translation from Hebrew and Greek with the reasoning behind every sentence."
readme = "README.md"
requires-python = ">=3.12"
license = "CC0-1.0 AND MIT"
urls = { Homepage = "https://openwordbible.org", Source = "https://github.com/jdegreef/open-word-bible" }

# CI runs `ruff check .` (a pinned ruff; see .github/workflows/ci.yml).
# No formatter: the code keeps its hand layout.
[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["vendor", "site"]

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, bugbear.
select = ["E", "W", "F", "B"]
ignore = [
    "B904",  # raise ... from err inside except: Python chains the original anyway
    "B905",  # zip() without strict=: adding it changes behaviour, so case by case
    "E741",  # `l` as a variable (a line, a language)
    "E743",  # `l` as a function name (build_site.py's login-page text helper)
]

[tool.ruff.lint.per-file-ignores]
# Page templates and generated migrations keep long lines whole.
"scripts/build_site.py" = [
    "E501",
    "B023",  # add() is called inside the loop iteration that defines it
]
"backend/*/migrations/*.py" = ["E501"]
"backend/api/views.py" = ["E501"]
"tests/test_open_bibles.py" = ["E501"]
